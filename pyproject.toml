[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfirauto"
version = "0.1.0"
description = "F-01 — DFIR-Auto: automated forensic triage with AI timeline reconstruction"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "google-generativeai>=0.7",
    "anthropic>=0.34",
    "openai>=1.40",
    "python-evtx>=0.7",
    "psutil>=5.9",
    "aiofiles>=23.2",
    "httpx>=0.27",
]

[project.scripts]
dfirauto = "dfirauto.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dfirauto*"]
